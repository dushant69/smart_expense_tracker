{% extends 'base.html' %}
{% block title %}Delete Expense{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 p-md-5 text-center">
            <div class="stat-icon mx-auto mb-3" style="background:linear-gradient(135deg,#ef4444,#dc2626);">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h4 class="fw-bold mb-2">Delete Expense?</h4>
            <p class="text-muted">
                Are you sure you want to delete
                <strong>"{{ expense.title }}"</strong> (₹{{ expense.amount }})?<br>
                This cannot be undone.
            </p>
            <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger rounded-pill px-4">
                    <i class="bi bi-trash me-1"></i>Yes, Delete
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
