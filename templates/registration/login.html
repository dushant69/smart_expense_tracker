{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card p-4 p-md-5">
        <div class="auth-logo"><i class="bi bi-wallet2"></i></div>
        <h4 class="text-center fw-bold mb-1">Welcome Back</h4>
        <p class="text-center text-muted mb-4">Login to your Expense Tracker</p>

        {% if form.errors %}
            <div class="alert alert-danger rounded-3 py-2">Invalid username or password.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-brand w-100 rounded-pill py-2">Login</button>
        </form>
        <p class="text-center text-muted mt-4 mb-0 small">
            Don't have an account? <a href="{% url 'signup' %}" class="fw-semibold text-decoration-none">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
